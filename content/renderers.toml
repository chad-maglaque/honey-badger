# Renderer registry — which app opens which kind of content.
#
# The launcher shows every renderer whose `requires` is met — a service that is
# running (a name from [portal.services]), or "app:<catalog id>" for a web app
# that must be installed under apps/ — and
# opens content with the device default unless the viewer picked their own
# (stored in their browser). Admins change the device default in Settings.
#
# URL placeholders:
#   {id}        catalog id                   {file}  path under /content/
#   {book}      ZIM book name (file minus .zim, as kiwix-serve names it)
#   {url}       URL-encoded /content/... link to the raw file

[kind.zim]
label = "Offline wiki (ZIM)"
default = "kiwix"
  [[kind.zim.renderer]]
  id = "kiwix"
  name = "Kiwix server"
  url = "/kiwix/viewer#{book}"
  requires = "kiwix"
  note = "Full-text search, images, works in any browser."
  [[kind.zim.renderer]]
  id = "kiwix-raw"
  name = "Kiwix (no frame)"
  url = "/kiwix/content/{book}/"
  requires = "kiwix"
  note = "Plain pages — best for very old phones and e-readers."
  [[kind.zim.renderer]]
  id = "kiwix-js"
  name = "Kiwix JS in your browser"
  url = "/apps/kiwix-js/www/index.html?archive={book}"
  requires = "app:kiwix-js"
  note = "Reads the archive client-side; small ZIMs can be kept on your device."
  [[kind.zim.renderer]]
  id = "download"
  name = "Download .zim"
  url = "/content/{file}"
  note = "For the Kiwix app on Android, iOS, Windows, macOS, Linux."

[kind.pmtiles]
label = "Map"
default = "maplibre"
  [[kind.pmtiles.renderer]]
  id = "maplibre"
  name = "Vector map (MapLibre)"
  url = "/maps/?map={id}"
  note = "Smooth zoom, search by place name, offline routing if installed. Needs WebGL."
  [[kind.pmtiles.renderer]]
  id = "lite"
  name = "Lite map (Leaflet, no WebGL)"
  url = "/maps/lite.html?map={id}"
  note = "Canvas renderer for old or low-power devices."
  [[kind.pmtiles.renderer]]
  id = "download"
  name = "Download .pmtiles file"
  url = "/content/{file}"
  note = "The raw map archive, for QGIS, another Badger or a PMTiles viewer. Organic Maps and OsmAnd can't open it — they use their own offline map downloads."

[kind.pdf]
label = "PDF"
default = "pdfjs"
  [[kind.pdf.renderer]]
  id = "pdfjs"
  name = "PDF.js viewer"
  url = "/apps/pdfjs/web/viewer.html?file={url}"
  note = "Search inside the document, works everywhere."
  [[kind.pdf.renderer]]
  id = "native"
  name = "Browser's own viewer"
  url = "/content/{file}"

[kind.epub]
label = "eBook"
default = "foliate"
  [[kind.epub.renderer]]
  id = "foliate"
  name = "Reader (foliate-js)"
  url = "/apps/foliate-js/reader.html?url={url}"
  note = "Paginated reading, adjustable font size, night mode."
  [[kind.epub.renderer]]
  id = "kavita"
  name = "Kavita library"
  url = "/books/"
  requires = "kavita"
  note = "Full library with covers, series, and reading progress per person."
  [[kind.epub.renderer]]
  id = "download"
  name = "Download .epub"
  url = "/content/{file}"

