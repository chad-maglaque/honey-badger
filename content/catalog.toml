# Honey Badger — content catalog (single source of truth)
#
# Every item: where it comes from, how big it is, which editions carry it.
#   tiers     field (512 GB drive) · base (1 TB) · ultimate (2 TB; 4 TB for growth) · pocket (pool
#             for budgeted laptop go-bags, filled by priority)
#   priority  1 = carry even on the smallest device … 9 = nice to have
#   source    kiwix | http | hf | git | rsync | pmtiles | manual (see upd.py)
#   size_gb   decimal GB, from the Kiwix mirror listing on 2026-11-16 (ZIM
#             sizes drift every release; upd uses the live size when fetching)
#   license   the item's licence, as its publisher states it
#   use       "any"      — may come preloaded on a Badger that is sold (public domain,
#                          CC BY, CC BY-SA, GPL, ODbL, …)
#             "personal" — non-commercial / personal use only (any CC BY-NC-*, "non-
#                          commercial" or "personal use" terms, creator-copyright video,
#                          or a licence nobody has checked yet). Never preloaded on a unit
#                          built with `prepper-build --for-sale` ([device] provisioning =
#                          "sale"); the owner is offered it at first setup and downloads
#                          it on their own Badger. A missing or unknown value counts as
#                          "personal", and any licence naming NC is "personal" whatever
#                          this field says (upd.py load_catalog). When unsure, "personal".
#
# Regenerate docs/CONTENTS.md after editing:  python3 tools/gen_contents.py


