# Installed by os/install.sh. The packaged unit has no Restart=: after a crash (or an OOM kill)
# every phone would lose the launcher until someone rebooted the Badger.
# No start limit: repeated restarts (the admin's "restart service", power-mode changes) must
# never leave it failed for good; RestartSec keeps a crash loop slow.
[Unit]
StartLimitIntervalSec=0

[Service]
Restart=on-failure
RestartSec=2
